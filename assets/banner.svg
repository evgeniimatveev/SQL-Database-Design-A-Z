<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="SQL and Database Design A-Z banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcf9f2"/>
      <stop offset="1" stop-color="#efe5cf"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)" stroke="#d9cdb2"/>
  <!-- decorative normalization: one wide table splits into three -->
  <g transform="translate(930 26)" font-family="Consolas, 'Courier New', monospace" font-size="13">
    <rect x="0" y="20" width="110" height="200" rx="8" fill="#ffffff" stroke="#336791" stroke-width="2"/>
    <rect x="0" y="20" width="110" height="26" rx="8" fill="#336791"/>
    <text x="55" y="38" text-anchor="middle" fill="#ffffff" font-weight="700">orders</text>
    <g fill="#1b2a41"><text x="10" y="68">id</text><text x="10" y="88">date</text><text x="10" y="108">customer</text><text x="10" y="128">address</text><text x="10" y="148">item</text><text x="10" y="168">price</text><text x="10" y="188">discount</text></g>
    <path d="M122 120 H160" stroke="#1b2a41" stroke-width="3" stroke-linecap="round"/><path d="M152 111 L166 120 L152 129 Z" fill="#1b2a41"/>
    <rect x="178" y="0" width="100" height="92" rx="8" fill="#ffffff" stroke="#336791" stroke-width="2"/>
    <rect x="178" y="0" width="100" height="24" rx="8" fill="#336791"/><text x="228" y="17" text-anchor="middle" fill="#ffffff" font-weight="700">orders</text>
    <g fill="#1b2a41"><text x="188" y="46">id</text><text x="188" y="64">date</text><text x="188" y="82">FK FK</text></g>
    <rect x="178" y="104" width="100" height="92" rx="8" fill="#ffffff" stroke="#cc2927" stroke-width="2"/>
    <rect x="178" y="104" width="100" height="24" rx="8" fill="#cc2927"/><text x="228" y="121" text-anchor="middle" fill="#ffffff" font-weight="700">customers</text>
    <g fill="#1b2a41"><text x="188" y="150">PK id</text><text x="188" y="168">address</text><text x="188" y="186">discount</text></g>
    <rect x="178" y="208" width="100" height="70" rx="8" fill="#ffffff" stroke="#4c8c7a" stroke-width="2"/>
    <rect x="178" y="208" width="100" height="24" rx="8" fill="#4c8c7a"/><text x="228" y="225" text-anchor="middle" fill="#ffffff" font-weight="700">items</text>
    <g fill="#1b2a41"><text x="188" y="252">PK item</text><text x="188" y="268">price</text></g>
  </g>
  <!-- title -->
  <text x="64" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#cc2927" letter-spacing="5">POSTGRESQL · SQL SERVER</text>
  <text x="62" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#1b2a41">SQL &amp; Database Design A–Z</text>
  <text x="64" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#336791">Queries  ·  Joins  ·  Database design  ·  Normalization 1NF → 3NF</text>
</svg>
